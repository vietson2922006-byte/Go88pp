<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Go88 MD5 - Fixed Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body { background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        #main-container { width: 100vw; height: 100vh; background: radial-gradient(circle, #5e0000, #000); position: relative; display: flex; flex-direction: column; align-items: center; }

        /* HEADER */
        .header { width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); border-bottom: 2px solid #d4af37; z-index: 10; color: gold; font-weight: bold; }

        /* HŨ XU */
        #jackpot-container { position: absolute; top: 60px; display: flex; flex-direction: column; align-items: center; z-index: 5; }
        #jackpot-amount { color: #ffff00; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px orange; font-family: monospace; }

        /* BÀN CHƠI */
        .table-area {
            position: relative; width: 95%; height: 320px;
            background: #700000; border: 5px solid #d4af37; border-radius: 160px;
            margin-top: 80px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; box-shadow: 0 0 50px #000, inset 0 0 40px #000;
            z-index: 2;
        }

        /* CỬA CƯỢC */
        .bet-box { 
            width: 120px; height: 120px; border-radius: 50%; border: 4px solid #d4af37; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: #111; cursor: pointer; position: relative; z-index: 3;
        }
        .tai { border-color: #00f2ff; }
        .xiu { border-color: #ff004c; }
        .label { font-size: 32px; font-weight: 900; pointer-events: none; }
        
        .player-count { position: absolute; top: -25px; color: #ccc; font-size: 11px; width: 100%; text-align: center; }
        .total-money { color: gold; font-size: 14px; font-weight: bold; pointer-events: none; }
        .my-bet-val { position: absolute; bottom: -25px; color: yellow; font-size: 12px; font-weight: bold; width: 100%; text-align: center; }

        /* ĐĨA & BÁT */
        #plate-area {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150px; height: 150px; z-index: 4; pointer-events: none;
        }
        #plate {
            width: 100%; height: 100%; background: #fff; border-radius: 50%; border: 8px solid #ccc;
            display: flex; justify-content: center; align-items: center; position: relative;
        }
        .dice-group { display: flex; gap: 4px; }
        .dice { width: 34px; height: 34px; background: white; border: 1px solid #999; border-radius: 5px; display: flex; justify-content: center; align-items: center; color: black; font-weight: bold; font-size: 22px; }

        #bowl {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #444, #111); border-radius: 50%; border: 2px solid gold;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.7s ease-in-out, opacity 0.5s; z-index: 10;
        }
        #bowl.open { transform: translateY(-130px); opacity: 0; }
        #timer-on-bowl { font-size: 50px; font-weight: 900; color: yellow; text-shadow: 0 0 15px #000; }

        /* POPUP CHỌN TIỀN */
        #bet-popup { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 999; justify-content: center; align-items: center; 
        }
        .popup-content { background: #222; border: 2px solid gold; border-radius: 15px; padding: 20px; width: 320px; text-align: center; }
        .money-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .money-btn { padding: 12px 0; background: #333; border: 1px solid gold; color: gold; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .money-btn:active { background: gold; color: black; }
        
        #custom-bet-display { width: 100%; background: #000; color: #0f0; border: 1px solid #444; padding: 10px; font-size: 24px; font-weight: bold; margin-bottom: 15px; border-radius: 5px; }

        .btn-confirm { background: #00ff00; color: black; padding: 15px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 18px; }
        .status-text { margin-top: 50px; font-size: 22px; font-weight: bold; color: gold; z-index: 1; }
        .btn-open-manual { margin-top: 20px; padding: 15px 40px; background: gold; color: black; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; display: none; z-index: 20; }
    </style>
</head>
<body>

<div id="main-container">
    <div class="header">
        <span>👤 VIETSON_PRO</span>
        <span id="balance">💰 100.000.000</span>
    </div>

    <div id="jackpot-container">
        <span id="jackpot-amount">5.284.152.000</span>
    </div>

    <div class="table-area">
        <div id="session-info" style="position: absolute; top: 15px; left: 60px; font-size: 12px; color: #aaa;">Phiên: #284152</div>
        
        <div class="bet-box tai" onclick="openBetPopup('TÀI')">
            <div class="player-count">👤 <span id="p-count-tai">0</span></div>
            <span class="total-money" id="all-money-tai">0</span>
            <span class="label" style="color: #00f2ff;">TÀI</span>
            <div class="my-bet-val">Bạn: <span id="my-bet-tai">0</span></div>
        </div>

        <div id="plate-area">
            <div id="plate">
                <div class="dice-group">
                    <div class="dice" id="d1">?</div>
                    <div class="dice" id="d2">?</div>
                    <div class="dice" id="d3">?</div>
                </div>
                <div id="bowl">
                    <div id="timer-on-bowl">60</div>
                </div>
            </div>
        </div>

        <div class="bet-box xiu" onclick="openBetPopup('XỈU')">
            <div class="player-count">👤 <span id="p-count-xiu">0</span></div>
            <span class="total-money" id="all-money-xiu">0</span>
            <span class="label" style="color: #ff004c;">XỈU</span>
            <div class="my-bet-val">Bạn: <span id="my-bet-xiu">0</span></div>
        </div>
    </div>

    <div class="status-text" id="status">VUI LÒNG ĐẶT CƯỢC</div>
    <button id="btnOpenManual" class="btn-open-manual" onclick="manualOpen()">MỞ BÁT</button>

    <div id="bet-popup">
        <div class="popup-content">
            <h3 id="popup-side" style="color:gold; margin-bottom: 10px;">CƯỢC TÀI</h3>
            <div id="custom-bet-display">0</div>
            <div class="money-grid">
                <button class="money-btn" onclick="addBet(1000)">1K</button>
                <button class="money-btn" onclick="addBet(10000)">10K</button>
                <button class="money-btn" onclick="addBet(50000)">50K</button>
                <button class="money-btn" onclick="addBet(100000)">100K</button>
                <button class="money-btn" onclick="addBet(500000)">500K</button>
                <button class="money-btn" onclick="addBet(1000000)">1M</button>
                <button class="money-btn" onclick="addBet(5000000)">5M</button>
                <button class="money-btn" onclick="addBet(50000000)">50M</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="resetPopupBet()" style="flex:1; padding:15px; background:#444; border:none; color:white; border-radius:8px; cursor:pointer;">XÓA</button>
                <button class="btn-confirm" onclick="confirmBet()">XÁC NHẬN</button>
            </div>
            <button onclick="closePopup()" style="margin-top:20px; background:none; border:none; color:#888; text-decoration:underline; cursor:pointer;">Đóng lại</button>
        </div>
    </div>
</div>

<script>
    let timeLeft = 60;
    let balance = 100000000;
    let myBets = { "TÀI": 0, "XỈU": 0 };
    let botMoney = { "TÀI": 0, "XỈU": 0 };
    let botPlayers = { "TÀI": 0, "XỈU": 0 };
    let tempBet = 0;
    let currentSide = "";
    let gameState = "BETTING";

    // Fix lỗi hiển thị bot
    setInterval(() => {
        if (gameState === "BETTING") {
            botMoney["TÀI"] += Math.floor(Math.random() * 1000000);
            botMoney["XỈU"] += Math.floor(Math.random() * 1000000);
            botPlayers["TÀI"] += Math.floor(Math.random() * 3);
            botPlayers["XỈU"] += Math.floor(Math.random() * 3);
            document.getElementById('all-money-tai').innerText = botMoney["TÀI"].toLocaleString();
            document.getElementById('all-money-xiu').innerText = botMoney["XỈU"].toLocaleString();
            document.getElementById('p-count-tai').innerText = botPlayers["TÀI"].toLocaleString();
            document.getElementById('p-count-xiu').innerText = botPlayers["XỈU"].toLocaleString();
        }
    }, 1000);

    function startNewGame() {
        gameState = "BETTING";
        timeLeft = 60;
        myBets = { "TÀI": 0, "XỈU": 0 };
        botMoney = { "TÀI": 0, "XỈU": 0 };
        botPlayers = { "TÀI": Math.floor(Math.random()*200), "XỈU": Math.floor(Math.random()*200) };
        
        document.getElementById('my-bet-tai').innerText = "0";
        document.getElementById('my-bet-xiu').innerText = "0";
        document.getElementById('bowl').classList.remove('open');
        document.getElementById('btnOpenManual').style.display = "none";
        document.getElementById('status').innerText = "VUI LÒNG ĐẶT CƯỢC";
        document.getElementById('status').style.color = "gold";
        
        prepareResult();

        let timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-on-bowl').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                startWaitPhase();
            }
        }, 1000);
    }

    function openBetPopup(side) {
        if (gameState !== "BETTING") return;
        currentSide = side;
        tempBet = 0;
        document.getElementById('popup-side').innerText = "CƯỢC " + side;
        document.getElementById('custom-bet-display').innerText = "0";
        document.getElementById('bet-popup').style.display = "flex";
    }

    function addBet(val) {
        tempBet += val;
        document.getElementById('custom-bet-display').innerText = tempBet.toLocaleString();
    }

    function resetPopupBet() {
        tempBet = 0;
        document.getElementById('custom-bet-display').innerText = "0";
    }

    function confirmBet() {
        if (tempBet > balance) return alert("Bạn không đủ tiền!");
        if (tempBet <= 0) return alert("Vui lòng chọn số tiền cược!");
        
        balance -= tempBet;
        myBets[currentSide] += tempBet;
        document.getElementById('balance').innerText = "💰 " + balance.toLocaleString();
        document.getElementById('my-bet-' + currentSide.toLowerCase()).innerText = myBets[currentSide].toLocaleString();
        closePopup();
    }

    function closePopup() { document.getElementById('bet-popup').style.display = "none"; }

    function startWaitPhase() {
        gameState = "WAITING";
        document.getElementById('timer-on-bowl').innerText = "5";
        document.getElementById('status').innerText = "HẾT GIỜ! MỜI MỞ BÁT";
        document.getElementById('btnOpenManual').style.display = "block";
        
        let wait = 5;
        let waitInterval = setInterval(() => {
            wait--;
            document.getElementById('timer-on-bowl').innerText = wait;
            if (wait <= 0) {
                clearInterval(waitInterval);
                if (gameState === "WAITING") manualOpen();
            }
        }, 1000);
    }

    function manualOpen() {
        if (gameState !== "WAITING") return;
        gameState = "RESULT";
        document.getElementById('bowl').classList.add('open');
        document.getElementById('btnOpenManual').style.display = "none";
        
        let d1 = parseInt(document.getElementById('d1').innerText);
        let d2 = parseInt(document.getElementById('d2').innerText);
        let d3 = parseInt(document.getElementById('d3').innerText);
        let sum = d1 + d2 + d3;
        let winSide = sum >= 11 ? "TÀI" : "XỈU";

        if (myBets[winSide] > 0) {
            let winAmt = myBets[winSide] * 1.98;
            balance += winAmt;
            document.getElementById('status').innerText = `THẮNG: +${winAmt.toLocaleString()}`;
            document.getElementById('status').style.color = "#00ff00";
        } else {
            document.getElementById('status').innerText = `KẾT QUẢ: ${winSide} (${sum})`;
            document.getElementById('status').style.color = "white";
        }
        document.getElementById('balance').innerText = "💰 " + balance.toLocaleString();
        setTimeout(startNewGame, 5000);
    }

    function prepareResult() {
        document.getElementById('d1').innerText = Math.floor(Math.random()*6)+1;
        document.getElementById('d2').innerText = Math.floor(Math.random()*6)+1;
        document.getElementById('d3').innerText = Math.floor(Math.random()*6)+1;
    }

    window.onload = startNewGame;
</script>
</body>
</html>
